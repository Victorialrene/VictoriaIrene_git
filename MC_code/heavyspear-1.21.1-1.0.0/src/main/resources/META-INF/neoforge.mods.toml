[[mods]]
modId = "heavyspear"
version = "${version}"
displayName = "Heavy Spear"
authors = "Heavy Spear contributors"
logoFile = "icon.png"
description = '''
Adds the Heavy Spear: a netherite spear with a heavy-core counterweight.

It keeps VanillaBackport's spear reach and charge attack, can receive the
spear enchantment Lunge, and also accepts the mace enchantments Density,
Breach and Wind Burst. Falling onto a target performs a mace smash attack.

新增“重矛”：长矛的突刺与蓄力攻击，加上重锤的落地猛击；
同时兼容长矛附魔（突刺）与重锤附魔（密度、破甲、风爆）。
'''

