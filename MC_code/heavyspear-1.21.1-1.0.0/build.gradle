plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'com.heavyspear'
version = '1.0.0'

base {
    archivesName = 'heavyspear-1.21.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

neoForge {
    // The pack in the request runs NeoForge 21.1.262. 21.1.249 is used here
    // because it is the locally cached build; the mod uses no APIs newer than
    // 21.1 and is compatible with both.
    version = '21.1.249'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        heavyspear {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // VanillaBackport is a runtime dependency, not something this mod bundles.
    // Put the jar in libs/ or pass -PvanillabackportJar=<absolute path>.
    def vbJar = findProperty('vanillabackportJar')
            ?: 'libs/VanillaBackport-neoforge-1.2.21.1-1.2.2.jar'
    compileOnly files(vbJar)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'Heavy Spear',
            'Implementation-Version': project.version
        )
    }
}
